[build]
  command = "bundle exec middleman build && npx puppeteer browsers install chrome && node generate-pdf.js"
  publish = "build"

[build.environment]
  RUBY_VERSION = "4.0.10"
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# limeblast.co.uk is an alias on this site; send it to the canonical host
[[redirects]]
  from = "https://limeblast.co.uk/*"
  to = "https://danielhollands.co.uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.limeblast.co.uk/*"
  to = "https://danielhollands.co.uk/:splat"
  status = 301
  force = true
