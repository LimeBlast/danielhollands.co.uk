[build]
  command = "bundle exec middleman build && npx puppeteer browsers install chrome && node generate-pdf.js"
  publish = "build"

[build.environment]
  RUBY_VERSION = "4.0.4"
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
